                <!-- ====================================================== -->
                <!-- VIEW: Memory                                            -->
                <!-- ====================================================== -->
                <div id="view-memory" class="view">

                            <div id="memory-panel-list">

                                    <div>
                                        <h2 class="text-xl font-bold text-slate-800 dark:text-slate-100" data-i18n="memory_title">记忆管理</h2>
                                        <p class="text-sm text-slate-500 dark:text-slate-400 mt-1" data-i18n="memory_desc">查看 Agent 记忆文件和内容</p>
                                    </div>
                                    <div class="flex items-center gap-3">
                                        <div id="memory-agent-select" class="cfg-dropdown cfg-dropdown-avatar cfg-dropdown-sm" tabindex="0" style="width: 160px;">
                                            <div class="cfg-dropdown-selected">
                                                <span class="cfg-dropdown-face"></span>
                                                <span class="cfg-dropdown-text">--</span>
                                                <i class="fas fa-chevron-down cfg-dropdown-arrow"></i>

                                            <div class="cfg-dropdown-menu"></div>
                                        </div>
                                        <div class="flex items-center bg-slate-100 dark:bg-white/10 rounded-lg p-0.5">

                                                <i class="fas fa-file-lines mr-1.5"></i><span data-i18n="memory_tab_files">记忆文件</span>
                                            </button>
                                            <button id="memory-tab-dreams" onclick="switchMemoryTab('dreams')"
                                                    class="memory-tab px-3 py-1.5 rounded-md text-xs font-medium cursor-pointer transition-colors duration-150">
                                                <i class="fas fa-seedling mr-1.5"></i><span data-i18n="memory_tab_dreams">自主进化</span>
                                            </button>
                                        </div>
                                    </div>
                                </div>
                                <div class="mb-4 relative">
                                    <i class="fas fa-search absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
                                    <input id="memory-search-input" type="text"
                                           data-i18n-placeholder="memory_search_ph"
                                           placeholder="搜索记忆、梦境日记与进化记录…"
                                           oninput="onMemorySearchInput(this.value)"
                                           class="w-full pl-9 pr-9 py-2 text-sm bg-panel border border-slate-200 dark:border-white/10 rounded-xl text-slate-700 dark:text-slate-200 placeholder-slate-400 dark:placeholder-slate-500 focus:outline-none focus:ring-1 focus:ring-primary-400/60">
                                    <button id="memory-search-clear" type="button" onclick="clearMemorySearch()"
                                            class="hidden absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 cursor-pointer p-1">
                                        <i class="fas fa-xmark text-xs"></i>
                                    </button>
                                </div>
                                <div id="memory-search-results" class="hidden space-y-2.5"></div>
                                <div id="memory-index-card" class="hidden mb-4 bg-panel rounded-xl border border-slate-200 dark:border-white/10 p-4">
                                    <div class="flex flex-wrap items-center justify-between gap-3">
                                        <div class="min-w-0 flex-1">
                                            <div class="flex flex-wrap items-center gap-2">
                                                <span class="text-xs font-semibold text-slate-700 dark:text-slate-200" data-i18n="memory_index_title">记忆向量索引</span>
                                                <span id="memory-index-mode" class="px-2 py-0.5 rounded-full text-[11px] font-medium bg-slate-100 dark:bg-white/10 text-slate-600 dark:text-slate-300"></span>
                                                <span id="memory-index-model" class="text-xs font-mono text-slate-500 dark:text-slate-400 truncate"></span>
                                            </div>
                                            <div id="memory-index-stats" class="text-xs text-slate-500 dark:text-slate-400 mt-1.5"></div>
                                        </div>
                                        <button id="memory-rebuild-btn" type="button" onclick="triggerMemoryIndexRebuild()"
                                                class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-medium bg-primary-500 hover:bg-primary-600 text-white disabled:opacity-50 disabled:cursor-not-allowed transition-colors cursor-pointer shrink-0">
                                            <i id="memory-rebuild-icon" class="fas fa-rotate text-[11px]"></i>
                                            <span id="memory-rebuild-label" data-i18n="memory_index_rebuild">重建索引</span>
                                        </button>
                                    </div>
                                    <div id="memory-index-warnings" class="hidden mt-2.5 space-y-1"></div>
                                </div>
                                <div id="evolution-backups-section" class="hidden mb-5 bg-panel rounded-xl border border-slate-200 dark:border-white/10 overflow-hidden">

                                        <div>
                                            <h3 class="text-xs font-semibold uppercase tracking-wider text-slate-600 dark:text-slate-300" data-i18n="evo_backups_title">进化快照与回滚</h3>
                                            <p class="text-xs text-slate-400 dark:text-slate-500 mt-0.5" data-i18n="evo_backups_desc">每次自主进化前自动备份 MEMORY.md、每日记忆与技能文件，支持对比变更与一键回滚</p>
                                        </div>
                                        <span id="evolution-backups-count" class="text-xs text-slate-400 dark:text-slate-500 shrink-0"></span>
                                    </div>
                                    <div id="evolution-backups-list" class="divide-y divide-slate-100 dark:divide-white/5"></div>
                                </div>
                                <div id="memory-empty" class="flex flex-col items-center justify-center py-20">
                                    <div class="w-16 h-16 rounded-2xl bg-purple-50 dark:bg-purple-900/20 flex items-center justify-center mb-4">
                                        <i class="fas fa-brain text-purple-400 text-xl"></i>
                                    </div>
                                    <p class="text-slate-500 dark:text-slate-400 font-medium" data-i18n="memory_loading">加载记忆文件中...</p>
                                    <p class="text-sm text-slate-400 dark:text-slate-500 mt-1" data-i18n="memory_loading_desc">记忆文件将显示在此处</p>
                                </div>
                                <div id="memory-list" class="hidden">
                                    <div class="bg-panel rounded-xl border border-slate-200 dark:border-white/10 overflow-hidden">
                                        <table class="w-full">
                                            <thead>
                                                <tr class="border-b border-slate-200 dark:border-white/10">
                                                    <th class="text-left px-4 py-3 text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400" data-i18n="memory_col_name">文件名</th>
                                                    <th class="text-left px-4 py-3 text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400" data-i18n="memory_col_type">类型</th>
                                                    <th class="text-left px-4 py-3 text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400" data-i18n="memory_col_size">大小</th>
                                                    <th class="text-left px-4 py-3 text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400" data-i18n="memory_col_updated">更新时间</th>
                                                </tr>
                                            </thead>
                                            <tbody id="memory-table-body"></tbody>
                                        </table>
                                    </div>
                                    <div id="memory-pagination" class="flex items-center justify-between mt-4 text-sm text-slate-500 dark:text-slate-400"></div>
                                </div>
                            </div>

                            <!-- Panel: file viewer / editor (replaces list) -->
                            <div id="memory-panel-viewer" class="hidden">
                                <div class="flex items-center gap-3 mb-6">
                                    <button onclick="closeMemoryViewer()"
                                            class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-sm
                                                   text-slate-500 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-white/10
                                                   border border-slate-200 dark:border-white/10 transition-colors cursor-pointer">
                                        <i class="fas fa-arrow-left text-xs"></i>
                                        <span data-i18n="memory_back">返回列表</span>
                                    </button>
                                    <h2 id="memory-viewer-title"
                                        class="flex-1 min-w-0 text-base font-semibold text-slate-800 dark:text-slate-100 font-mono truncate"></h2>
                                    <button id="memory-btn-cite" onclick="citeCurrentMemoryToChat()"
                                            class="doc-action-btn hidden">
                                        <i class="fas fa-at text-xs"></i>
                                        <span data-i18n="cite_to_chat">引用到对话</span>
                                    </button>
                                    <button id="memory-btn-edit" onclick="memoryEditor.start()"
                                            class="doc-action-btn hidden">
                                        <i class="fas fa-pen text-xs"></i>
                                        <span data-i18n="ws_edit">编辑</span>
                                    </button>
                                    <button id="memory-btn-save" onclick="memoryEditor.save()"
                                            class="doc-action-btn doc-action-btn-primary hidden">
                                        <i class="fas fa-check text-xs"></i>
                                        <span data-i18n="ws_edit_save">保存 (Ctrl+S)</span>
                                    </button>
                                    <button id="memory-btn-cancel" onclick="memoryEditor.cancel()"
                                            class="doc-action-btn hidden">
                                        <i class="fas fa-xmark text-xs"></i>
                                        <span data-i18n="ws_edit_cancel">退出编辑</span>
                                    </button>
                                </div>
                                <div class="bg-panel rounded-xl border border-slate-200 dark:border-white/10 overflow-hidden">
                                    <div id="memory-viewer-content"
                                         class="p-5 overflow-y-auto text-sm msg-content text-slate-700 dark:text-slate-200"
                                         style="max-height: calc(100dvh - 220px)"></div>
                                </div>
                            </div>

                            <!-- Panel: evolution snapshot diff & rollback -->
                            <div id="memory-panel-diff" class="hidden">
                                <div class="flex flex-wrap items-center gap-3 mb-6">
                                    <button type="button" onclick="closeEvolutionDiff()"
                                            class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-sm
                                                   text-slate-500 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-white/10
                                                   border border-slate-200 dark:border-white/10 transition-colors cursor-pointer">
                                        <i class="fas fa-arrow-left text-xs"></i>
                                        <span data-i18n="memory_back">返回列表</span>
                                    </button>
                                    <div class="flex-1 min-w-0">
                                        <h2 id="evolution-diff-title" class="text-base font-semibold text-slate-800 dark:text-slate-100 font-mono truncate"></h2>
                                        <p id="evolution-diff-subtitle" class="text-xs text-slate-500 dark:text-slate-400 mt-0.5"></p>
                                    </div>
                                    <button id="evolution-diff-restore-btn" type="button"
                                            class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-medium bg-red-500 hover:bg-red-600 text-white disabled:opacity-50 disabled:cursor-not-allowed transition-colors cursor-pointer">
                                        <i class="fas fa-rotate-left text-xs"></i>
                                        <span data-i18n="evo_restore_btn">回滚到此快照</span>
                                    </button>
                                </div>
                                <div id="evolution-diff-files" class="space-y-4"></div>
                            </div>

                        </div>
                    </div>
                </div>
