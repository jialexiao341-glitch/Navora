<div id="focus-notice" class="focus-notice" role="status" hidden></div>
<div id="ambient-player" class="ambient-player is-collapsed align-right">
    <section id="ambient-panel" class="ambient-panel" aria-label="休闲空间" data-i18n-aria-label="ambient_title">
        <header><div><span class="ambient-eyebrow" data-i18n="ambient_eyebrow">YOUR SPACE</span><h2 data-i18n="ambient_title">休闲空间</h2></div><button id="ambient-close" type="button" data-i18n-aria-label="ambient_close" aria-label="收起">×</button></header>
        <div class="ambient-tabs" role="tablist" data-i18n-aria-label="focus_tabs" aria-label="休闲工具">
            <button id="ambient-music-tab" type="button" role="tab" aria-selected="true" aria-controls="ambient-music-view" data-i18n="focus_music">音乐</button>
            <button id="ambient-sounds-tab" type="button" role="tab" aria-selected="false" aria-controls="ambient-sounds-view" data-i18n="sounds_tab">环境音</button>
            <button id="ambient-leisure-tab" type="button" role="tab" aria-selected="false" aria-controls="ambient-leisure-view" data-i18n="leisure_tab">轻松聊</button>
            <button id="ambient-focus-tab" type="button" role="tab" aria-selected="false" aria-controls="ambient-focus-view" data-i18n="focus_tab">专注计时</button>
            <button id="ambient-pet-tab" type="button" role="tab" aria-selected="false" aria-controls="ambient-pet-view">桌宠</button>
        </div>
        <div id="ambient-music-view" role="tabpanel" aria-labelledby="ambient-music-tab">
        <div class="ambient-now"><span class="ambient-art"><i class="fas fa-music" aria-hidden="true"></i></span><div><small data-i18n="ambient_now">正在播放</small><strong id="ambient-title"></strong></div></div>
        <input id="ambient-progress" class="ambient-range" type="range" min="0" max="1000" value="0" data-i18n-aria-label="ambient_progress" aria-label="播放进度">
        <div id="ambient-time" class="ambient-time">0:00 / 0:00</div>
        <div class="ambient-controls"><button id="ambient-previous" type="button" data-i18n-aria-label="ambient_previous" aria-label="上一首"><i class="fas fa-backward-step"></i></button><button id="ambient-play" class="ambient-play" type="button" aria-label="播放"><i id="ambient-play-icon" class="fas fa-play"></i></button><button id="ambient-next" type="button" data-i18n-aria-label="ambient_next" aria-label="下一首"><i class="fas fa-forward-step"></i></button></div>
        <div class="ambient-options"><label><i class="fas fa-volume-low" aria-hidden="true"></i><input id="ambient-volume" class="ambient-range" type="range" min="0" max="1" step="0.01" data-i18n-aria-label="ambient_volume" aria-label="音量"></label><label><input id="ambient-loop" type="checkbox"> <span data-i18n="ambient_loop">列表循环</span></label></div>
        <div class="ambient-list-head"><span data-i18n="ambient_playlist">播放列表</span><button id="ambient-add" type="button"><i class="fas fa-plus" aria-hidden="true"></i> <span data-i18n="ambient_add">添加音乐</span></button></div>
        <ul id="ambient-list" class="ambient-list"></ul><p id="ambient-status" class="ambient-status" role="status"></p>
        </div>
        <div id="ambient-sounds-view" role="tabpanel" aria-labelledby="ambient-sounds-tab" hidden>
            <p class="sounds-intro" data-i18n="sounds_intro">为此刻，留一点宁静。</p>
            <div class="sounds-list">
                <button type="button" class="sounds-choice" data-sound="rain" aria-pressed="false"><i class="fas fa-cloud-rain"></i><span><strong data-i18n="sounds_rain">窗边雨声</strong><small data-i18n="sounds_rain_desc">细雨轻落，平静专注</small></span><i class="fas fa-play sounds-icon"></i></button>
                <button type="button" class="sounds-choice" data-sound="wind" aria-pressed="false"><i class="fas fa-wind"></i><span><strong data-i18n="sounds_wind">林间微风</strong><small data-i18n="sounds_wind_desc">风声徐徐，舒缓呼吸</small></span><i class="fas fa-play sounds-icon"></i></button>
                <button type="button" class="sounds-choice" data-sound="fire" aria-pressed="false"><i class="fas fa-fire"></i><span><strong data-i18n="sounds_fire">暖炉轻响</strong><small data-i18n="sounds_fire_desc">温暖火光，放松片刻</small></span><i class="fas fa-play sounds-icon"></i></button>
            </div>
            <label class="sounds-volume"><span data-i18n="sounds_volume">环境音音量</span><input id="sounds-volume" class="ambient-range" type="range" min="0" max="1" step="0.01" value="0.35" data-i18n-aria-label="sounds_volume" aria-label="环境音音量"></label>
            <p id="sounds-status" class="focus-status" role="status"></p>
        </div>
        <div id="ambient-leisure-view" role="tabpanel" aria-labelledby="ambient-leisure-tab" hidden>
            <p class="sounds-intro" data-i18n="leisure_intro">选个话题，给自己一点轻松时光。</p>
            <div class="sounds-list">
                <button type="button" class="sounds-choice leisure-choice" data-leisure="riddle"><i class="fas fa-lightbulb" aria-hidden="true"></i><span><strong data-i18n="leisure_riddle">趣味猜谜</strong><small data-i18n="leisure_riddle_desc">动动脑，猜一个小谜题</small></span><i class="fas fa-arrow-right sounds-icon" aria-hidden="true"></i></button>
                <button type="button" class="sounds-choice leisure-choice" data-leisure="story"><i class="fas fa-book-open" aria-hidden="true"></i><span><strong data-i18n="leisure_story">故事接龙</strong><small data-i18n="leisure_story_desc">一起写一个意想不到的故事</small></span><i class="fas fa-arrow-right sounds-icon" aria-hidden="true"></i></button>
                <button type="button" class="sounds-choice leisure-choice" data-leisure="trivia"><i class="fas fa-star" aria-hidden="true"></i><span><strong data-i18n="leisure_trivia">趣味问答</strong><small data-i18n="leisure_trivia_desc">发现有趣的小知识</small></span><i class="fas fa-arrow-right sounds-icon" aria-hidden="true"></i></button>
            </div>
            <p class="leisure-note" data-i18n="leisure_note">话题会填入输入框，确认后由你发送；使用当前模型，可能产生正常费用。</p>
        </div>
        <div id="ambient-focus-view" role="tabpanel" aria-labelledby="ambient-focus-tab" hidden>
            <div class="focus-modes"><button id="focus-work" type="button" aria-pressed="true" data-i18n="focus_work">专注</button><button id="focus-break" type="button" aria-pressed="false" data-i18n="focus_break">休息</button></div>
            <div id="focus-clock" class="focus-clock" aria-live="off">25:00</div>
            <label class="focus-duration"><span data-i18n="focus_duration">时长（分钟）</span><input id="focus-minutes" type="number" min="1" max="180" step="1" value="25"></label>
            <div class="focus-actions"><button id="focus-start" type="button" data-i18n="focus_start">开始</button><button id="focus-reset" type="button" data-i18n="focus_reset">重置</button></div>
            <p id="focus-status" class="focus-status" role="status"></p>
        </div>
<section id="ambient-pet-view" class="pet-settings" role="tabpanel" aria-labelledby="ambient-pet-tab" hidden>
    <label>选择桌宠<select id="pet-character"><option value="shenshen">深深</option><option value="doro">Doro</option></select></label>
    <label>显示桌宠<input id="pet-enabled" type="checkbox" role="switch"></label>
    <label>显示大小<select id="pet-size"><option value="240">小</option><option value="320">标准</option><option value="400">大</option><option value="480">超大</option></select></label>
    <label>自由漫游<input id="pet-roam" type="checkbox"></label>
    <label>锁定位置<input id="pet-lock" type="checkbox"></label>
    <label>播放动作<select id="pet-animation"><option value="">选择动作</option></select></label>
    <div class="pet-actions"><button id="pet-sleep" type="button">睡觉</button><button id="pet-hide" type="button">隐藏桌宠</button></div>
    <div class="pet-actions"><button id="pet-open-chat" type="button">回到对话</button></div>
    <p id="pet-status" role="status">点击互动 · 拖动甩抛 · 右键设置</p>
    <small>素材来源：<a id="pet-source" href="https://github.com/MerZlin/dsh-pet-indesktop" target="_blank" rel="noopener noreferrer">MerZlin/dsh-pet-indesktop</a> · 角色素材仅限个人非商业使用</small>
</section>
        <input id="ambient-files" type="file" accept="audio/*,.mp3,.wav,.ogg,.m4a,.flac,.aac" multiple hidden><audio id="ambient-audio" preload="metadata"></audio>
    </section>
    <button id="ambient-toggle" class="ambient-toggle" type="button" aria-controls="ambient-panel" aria-expanded="false" data-i18n-aria-label="ambient_title" aria-label="休闲空间"><svg class="ambient-mark" viewBox="0 0 32 32" fill="none" aria-hidden="true" focusable="false">
            <path d="M16 4.2c1.5 0 2.6 3.3 2.6 6.1S17.5 16 16 16s-2.6-2.9-2.6-5.7S14.5 4.2 16 4.2Z" fill="currentColor"/>
            <path d="M27.8 16c0 1.5-3.3 2.6-6.1 2.6S16 17.5 16 16s2.9-2.6 5.7-2.6 6.1 1.1 6.1 2.6Z" fill="currentColor" opacity=".8"/>
            <path d="M16 27.8c-1.5 0-2.6-3.3-2.6-6.1S14.5 16 16 16s2.6 2.9 2.6 5.7-1.1 6.1-2.6 6.1Z" fill="currentColor" opacity=".65"/>
            <path d="M4.2 16c0-1.5 3.3-2.6 6.1-2.6S16 14.5 16 16s-2.9 2.6-5.7 2.6S4.2 17.5 4.2 16Z" fill="currentColor" opacity=".8"/>
            <circle cx="16" cy="16" r="2.2" fill="rgb(var(--cw-panel))"/>
        </svg><span id="focus-badge" class="focus-badge" hidden></span></button>
</div>

<button id="pet-task-bubble" class="pet-task-bubble" type="button" title="打开当前对话">我在这里陪你，点这里开始对话。</button>
<div id="indesktop-pet" class="indesktop-pet" tabindex="0" role="button" aria-label="深深桌宠，点击互动，右键打开设置" hidden>
    <video muted playsinline preload="auto"></video><video muted playsinline preload="auto"></video><canvas hidden></canvas>
</div>
