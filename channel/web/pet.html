<!DOCTYPE html>
<html lang="zh" class="pet-window-mode">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navora Companion</title>
    <link rel="stylesheet" href="/assets/vendor/fontawesome/css/all.min.css">
    <link rel="stylesheet" href="/assets/vendor/fonts/inter/inter.css">
    <link rel="stylesheet" href="/assets/css/base.css">
    <link rel="stylesheet" href="/assets/css/themes.css">
    <link rel="stylesheet" href="/assets/css/indesktop-pet.css">
    <script>
    window.__cowNormalizeLang__ = function(raw) {
        if (!raw) return '';
        var v = String(raw).trim().toLowerCase().replace('_', '-');
        if (v === 'auto') return '';
        if (v === 'zh-hant' || v.indexOf('zh-hant-') === 0 || v === 'zh-tw' || v === 'zh-hk') return 'zh-Hant';
        if (v.indexOf('zh') === 0) return 'zh';
        if (v.indexOf('en') === 0) return 'en';
        return '';
    };
    window.__cowResolveLang__ = function() {
        return window.__cowNormalizeLang__(localStorage.getItem('cow_lang'))
            || window.__cowNormalizeLang__(window.__COW_DEFAULT_LANG__)
            || window.__cowNormalizeLang__(navigator.language || (navigator.languages && navigator.languages[0]))
            || 'zh';
    };
    (function() {
        window.__COW_DEFAULT_LANG__ = '{{COW_DEFAULT_LANG}}';
        window.__COW_DEFAULT_THEME__ = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        var theme = localStorage.getItem('cow_theme') || window.__COW_DEFAULT_THEME__;
        if (theme === 'dark') document.documentElement.classList.add('dark');
        try {
            var cached = JSON.parse(localStorage.getItem('cow_theme_cache') || 'null');
            var state = cached && cached.id === localStorage.getItem('cow_theme_id') && cached[theme === 'dark' ? 'dark' : 'light'];
            if (state && state.vars) {
                for (var name in state.vars) {
                    if (name.indexOf('--cw-') === 0) document.documentElement.style.setProperty(name, state.vars[name]);
                }
            }
        } catch (e) {}
        if (window.electronAPI) {
            document.documentElement.classList.add('electron-desktop');
            document.documentElement.classList.add(window.electronAPI.platform === 'darwin' ? 'electron-mac' : 'electron-win');
        }
    })();
    </script>
</head>
<body class="pet-window-mode">
    <!--#include templates/layout/ambient-player.html-->
    <script defer src="/assets/js/core/i18n/zh.js"></script>
    <script defer src="/assets/js/core/i18n/zh-Hant.js"></script>
    <script defer src="/assets/js/core/i18n/en.js"></script>
    <script defer src="/assets/js/core/i18n.js"></script>
    <script defer src="/assets/js/core/indesktop-pet-helpers.js"></script>
    <script defer src="/assets/js/core/indesktop-pet.js"></script>
    <script>
    window.addEventListener('DOMContentLoaded', function() {
        if (typeof applyI18n === 'function') applyI18n();
    });
    </script>
</body>
</html>
