name: Release Desktop

# Navora Desktop Build & GitHub Releases Pipeline.
# Builds the Python backend (PyInstaller onedir) + Electron desktop shell,
# runs pre-release integrity checks, uploads workflow artifacts, and publishes
# release assets (installer + blockmap + latest*.yml) to GitHub Releases.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to stamp (e.g. 2.2.3-test). Empty uses desktop/package.json."
        type: string
        default: ""
      platforms:
        description: "Target platforms to build"
        type: choice
        default: "windows"
        options:
          - windows
          - all
      publish_release:
        description: "Create/update GitHub Release with built assets"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  prepare:
    name: Prepare Build Matrix
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      matrix: ${{ steps.meta.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version and matrix
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ]; then
            ver="${GITHUB_REF_NAME#v}"
            target_platforms="all"
          else
            ver="${{ github.event.inputs.version }}"
            ver="${ver#v}"
            if [ -z "$ver" ]; then
              ver="$(node -p "require('./desktop/package.json').version")"
            fi
            target_platforms="${{ github.event.inputs.platforms }}"
          fi

          prerelease=false
          if [[ "$ver" == *-* ]]; then
            prerelease=true
          fi

          if [ "$target_platforms" = "all" ]; then
            matrix='{"include":[{"name":"Windows x64","os":"windows-latest","platform":"win","arch":"x64","eb_flags":"--win --x64"},{"name":"macOS arm64","os":"macos-15","platform":"mac","arch":"arm64","eb_flags":"--mac --arm64"},{"name":"macOS x64","os":"macos-15-intel","platform":"mac","arch":"x64","eb_flags":"--mac --x64"}]}'
          else
            matrix='{"include":[{"name":"Windows x64","os":"windows-latest","platform":"win","arch":"x64","eb_flags":"--win --x64"}]}'
          fi

          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "tag=v$ver" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "Resolved version=$ver prerelease=$prerelease platforms=$target_platforms"

  build:
    name: Build ${{ matrix.name }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Ensure bundled backend /api/version matches installer version.
      - name: Write version into cli/VERSION
        shell: bash
        env:
          VER: ${{ needs.prepare.outputs.version }}
        run: bash desktop/build/stamp-backend-version.sh "$VER"

      - name: Build Python backend (PyInstaller)
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r desktop/build/requirements-desktop.txt
          pip install pyinstaller
          pyinstaller desktop/build/cowagent-backend.spec \
            --noconfirm \
            --distpath desktop/build/dist \
            --workpath desktop/build/build-work

      - name: Verify bundled backend version
        shell: bash
        env:
          VER: ${{ needs.prepare.outputs.version }}
        run: bash desktop/build/stamp-backend-version.sh --verify "$VER"

      - name: Scan bundled backend for sensitive files
        shell: bash
        run: |
          set -euo pipefail
          hits="$(find desktop/build/dist -type f \( -name 'config.json' -o -name '.env' -o -name '.env.*' -o -name '*.pem' -o -name '*.key' \) ! -path '*/certifi/*' ! -path '*/playwright/*' ! -path '*/grpc/_cython/_credentials/roots.pem' || true)"
          if [ -n "$hits" ]; then
            echo "::error::Sensitive or personal config file detected in backend bundle:"
            echo "$hits"
            exit 1
          fi

      - name: Verify backend architecture (macOS)
        if: matrix.platform == 'mac'
        shell: bash
        run: |
          want=arm64
          [ "${{ matrix.arch }}" = "arm64" ] || want=x86_64
          got="$(lipo -archs desktop/build/dist/cowagent-backend/cowagent-backend)"
          echo "backend arch: $got (want $want)"
          if [ "$got" != "$want" ]; then
            echo "::error::backend is $got but this job targets $want"
            exit 1
          fi

      - name: Verify no extension links a foreign OpenSSL (macOS)
        if: matrix.platform == 'mac'
        shell: bash
        run: |
          internal=desktop/build/dist/cowagent-backend/_internal
          bad=""
          while IFS= read -r -d '' so; do
            case "$so" in */python3.*/lib-dynload/*) continue ;; esac
            if otool -L "$so" | tail -n +2 | grep -Eq 'lib(ssl|crypto)\.[0-9.]+dylib'; then
              bad="$bad ${so#$internal/}"
            fi
          done < <(find "$internal" -name '*.so' -print0)
          if [ -n "$bad" ]; then
            echo "::error::extensions dynamically linked to OpenSSL:$bad"
            exit 1
          fi

      - name: Install desktop deps
        working-directory: desktop
        run: npm ci

      - name: Bundle ripgrep binary (Windows only)
        if: matrix.platform == 'win'
        shell: bash
        env:
          RG_VERSION: "15.2.0"
        run: |
          set -euo pipefail
          mkdir -p desktop/resources/bin
          url="https://github.com/BurntSushi/ripgrep/releases/download/${RG_VERSION}/ripgrep-${RG_VERSION}-x86_64-pc-windows-msvc.zip"
          curl -fL "$url" -o rg.zip
          unzip -j -o rg.zip '*/rg.exe' -d desktop/resources/bin
          ls -l desktop/resources/bin

      - name: Write version into package.json
        working-directory: desktop
        shell: bash
        run: npm version "${{ needs.prepare.outputs.version }}" --no-git-tag-version --allow-same-version

      - name: Compile (vite + tsc)
        working-directory: desktop
        shell: bash
        run: npm run build

      - name: Download Windows signing CLI
        if: matrix.platform == 'win' && vars.SIGNTOOL_CLI_URL != ''
        shell: bash
        env:
          SIGNTOOL_CLI_URL: ${{ vars.SIGNTOOL_CLI_URL }}
        run: |
          mkdir -p "$RUNNER_TEMP/signtool"
          curl -fsSL "$SIGNTOOL_CLI_URL" -o "$RUNNER_TEMP/signtool/cli.zip"
          unzip -o "$RUNNER_TEMP/signtool/cli.zip" -d "$RUNNER_TEMP/signtool" >/dev/null
          exe="$(find "$RUNNER_TEMP/signtool" -type f -iname 'signtool*.exe' | head -n1)"
          if [ -z "$exe" ]; then
            echo "signtool.exe not found in downloaded archive" >&2
            exit 1
          fi
          echo "SIGNTOOL_PATH=$(cygpath -w "$exe")" >> "$GITHUB_ENV"

      - name: Package installer (electron-builder)
        working-directory: desktop
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          SIGNTOOL_ACCESS_KEY: ${{ secrets.SIGNTOOL_ACCESS_KEY }}
          SIGNTOOL_ACCESS_SECRET: ${{ secrets.SIGNTOOL_ACCESS_SECRET }}
          SIGNTOOL_CERT_CODE: ${{ secrets.SIGNTOOL_CERT_CODE }}
          COW_SIGN_DRY_RUN: ${{ vars.COW_SIGN_DRY_RUN }}
        run: |
          case "${{ matrix.platform }}" in
            mac)
              if [ -n "$MAC_CSC_LINK" ]; then
                export CSC_LINK="$MAC_CSC_LINK"
                export CSC_KEY_PASSWORD="$MAC_CSC_KEY_PASSWORD"
              fi
              config_arg="--config electron-builder.js"
              ;;
            win)
              config_arg="--config electron-builder.win.js"
              ;;
            *)
              config_arg=""
              ;;
          esac
          node node_modules/electron-builder/cli.js ${{ matrix.eb_flags }} $config_arg --publish never

      - name: Pre-release checks on packaged installer
        shell: bash
        env:
          VER: ${{ needs.prepare.outputs.version }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          ls -la desktop/release
          if [ "$PLATFORM" = "win" ]; then
            test -f "desktop/release/latest.yml" || { echo "::error::Missing latest.yml"; exit 1; }
            grep -Eq "^version:[[:space:]]*['\"]?${VER}['\"]?" desktop/release/latest.yml || {
              echo "::error::latest.yml version mismatch (expected $VER)"
              cat desktop/release/latest.yml
              exit 1
            }
            ls desktop/release/*.exe >/dev/null 2>&1 || { echo "::error::Missing Windows .exe installer"; exit 1; }
          fi

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: navora-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            desktop/release/*.dmg
            desktop/release/*.zip
            desktop/release/*.exe
            desktop/release/*.yml
            desktop/release/*.blockmap
          if-no-files-found: ignore
          retention-days: 14

  publish-release:
    name: Publish to GitHub Releases
    needs: [prepare, build]
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.publish_release == 'true')
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Stage and verify release files
        id: stage
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          dupes="$(find artifacts -type f \( -name '*.dmg' -o -name '*.zip' -o -name '*.exe' \) \
            -exec basename {} \; | sort | uniq -d)"
          if [ -n "$dupes" ]; then
            echo "::error::Duplicate installer filenames across matrix jobs: $dupes"
            exit 1
          fi
          find artifacts -type f \( -name '*.dmg' -o -name '*.zip' -o -name '*.exe' -o -name '*.yml' -o -name '*.blockmap' \) -exec cp {} dist/ \;
          ls -la dist
          if [ -z "$(ls -A dist 2>/dev/null)" ]; then
            echo "::error::No release files produced"
            exit 1
          fi

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VER: ${{ needs.prepare.outputs.version }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          set -euo pipefail
          flags=()
          if [ "$PRERELEASE" = "true" ]; then
            flags+=(--prerelease)
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "Navora v${VER}" --generate-notes "${flags[@]}"
          fi
